interface:
  display_name: 'Paxaver Child'
  short_description: 'Lunch menu and own orders for a Paxaver child - read-only.'
  brand_color: '#8B5CF6'
  default_prompt: "What's for lunch today?"

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: 'mcp'
      value: 'paxaver'
      description: 'Paxaver MCP server'
      transport: 'streamable_http'
      url: 'https://mcp.paxaver.com/mcp'
