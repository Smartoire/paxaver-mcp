name: Notify Deploy

# Thin trigger only — all deploy logic lives in Smartoire/paxaver-audit.
# Push to main -> mcp.paxaver.dev; v* tag -> mcp.paxaver.com.
# This job holds no deploy secrets; AUDIT_DISPATCH_TOKEN can only call
# repository_dispatch on the audit repo.

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch deploy to paxaver-audit
        env:
          GH_TOKEN: ${{ secrets.AUDIT_DISPATCH_TOKEN }}
        run: |
          type="mcp-staging"
          case "$GITHUB_REF" in
            refs/tags/v*) type="mcp-production" ;;
          esac
          gh api repos/Smartoire/paxaver-audit/dispatches -X POST \
            -f event_type="$type" \
            -f "client_payload[repo]=$GITHUB_REPOSITORY" \
            -f "client_payload[ref]=$GITHUB_REF" \
            -f "client_payload[sha]=$GITHUB_SHA" \
            -f "client_payload[actor]=$GITHUB_ACTOR"
