name: Full test

# Runs the full suite on the default branch every 6 hours, and on demand.
# A failed run opens one `ci:full-failed` issue in the team's private tracker,
# or comments on the open one. A later green run comments on that issue.
# Nothing closes it automatically.
#
# Public repo: no pull_request_target. The only secret is PAXAVER_TRACKER_TOKEN,
# used by the report job alone, and this workflow runs only on schedule and
# manual dispatch (never on fork pull requests).

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-test
  cancel-in-progress: false

jobs:
  gate:
    # A scheduled run skips a commit that already passed a full run.
    # A manual dispatch always runs.
    runs-on: [self-hosted, linux, office, public-repo]
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      # A gate error must run the suite, not skip it. Without this, the
      # failed gate job cuts the chain and nothing runs or reports.
      - id: check
        if: github.event_name == 'schedule'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'full.yml',
              head_sha: context.sha,
              status: 'success',
              per_page: 1,
            });
            core.setOutput('skip', data.total_count > 0 ? 'true' : 'false');

  full:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: [self-hosted, linux, office, public-repo]
    container: node:26-bookworm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The registry publish job requires the tag and every version-bearing
      # release manifest to agree on the package version — catch drift
      # before the tag.
      - name: Assert release manifest versions agree with package.json
        run: |
          PKG=$(node -p "require('./package.json').version")
          for f in server.json lhm.plugin.json .codex-plugin/plugin.json certification/microsoft/manifest.json; do
            V=$(node -p "require('./$f').version")
            if [ "$PKG" != "$V" ]; then
              echo "::error::version mismatch — package.json=$PKG $f=$V"
              exit 1
            fi
          done
          echo "all release manifest versions agree: $PKG"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm wrangler:check

  report:
    needs: [gate, full]
    if: always() && (needs.full.result == 'failure' || needs.full.result == 'success')
    runs-on: [self-hosted, linux, office, public-repo]
    container: node:26-bookworm
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/github-script@v7
        env:
          FULL_RESULT: ${{ needs.full.result }}
          TRACKER_TOKEN: ${{ secrets.PAXAVER_TRACKER_TOKEN }}
          TRACKER_REPO_VAR: ${{ vars.PAXAVER_TRACKER_REPO }}
        with:
          script: |
            const { execFileSync } = require('child_process');
            const { owner, repo } = context.repo;
            const sha = context.sha;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            // Tickets go to the team's private tracker, never to this public
            // repo. The tracker is named by the repository variable
            // PAXAVER_TRACKER_REPO ("owner/repo"), so this file names no
            // private repo. The token is scoped to that tracker's issues.
            const trackerRepo = process.env.TRACKER_REPO_VAR || '';
            const [TRACKER_OWNER = '', TRACKER_REPO = ''] = trackerRepo.split('/');
            const TRACKER_FILTER = 'ci:full-failed,repo:paxaver-mcp';

            // Last successful full run on this branch, other than this one.
            const { data: prev } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'full.yml',
              branch: process.env.GITHUB_REF_NAME,
              status: 'success', per_page: 5,
            });
            const last = prev.workflow_runs.find(
              (r) => r.id !== Number(context.runId) && r.head_sha !== sha
            ) || null;

            let text;
            let failureBody = null;
            if (process.env.FULL_RESULT === 'success') {
              text = `green again at \`${sha}\` (${runUrl})`;
            } else {
              // Failed: each failed job and its first failed step.
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner, repo, run_id: context.runId, filter: 'latest', per_page: 100,
              });
              const failed = jobs
                .filter((j) => j.conclusion === 'failure')
                .map((j) => {
                  const step = (j.steps || []).find((s) => s.conclusion === 'failure');
                  return `- ${j.name}: ${step ? `step "${step.name}"` : 'no failed step recorded'}`;
                });

              // Commits that could have caused it: last green sha .. this sha.
              let log;
              try {
                const args = last
                  ? ['log', '--oneline', `${last.head_sha}..${sha}`]
                  : ['log', '--oneline', '-20', sha];
                log = execFileSync('git', args, { encoding: 'utf8' }).trim();
              } catch (e) {
                log = `(git log failed: ${e.message.split('\n')[0]})`;
              }

              failureBody = [
                `Full test failed at \`${sha}\`.`,
                '',
                `- Run: ${runUrl}`,
                `- Tested sha: \`${sha}\``,
                `- Last green full run: ${last ? `\`${last.head_sha}\` (${last.html_url})` : 'none on this branch; the last 20 commits follow'}`,
                '',
                'Failed jobs:',
                failed.length ? failed.join('\n') : '- none recorded; see the run log',
                '',
                'Commits since the last green full run:',
                '```',
                log || '(no commits)',
                '```',
              ].join('\n');
              text = failureBody;
            }

            // Fail closed: without the token or the tracker variable, print the
            // report and fail the job. Never fall back to the public repo.
            if (!process.env.TRACKER_TOKEN || !TRACKER_OWNER || !TRACKER_REPO) {
              await core.summary
                .addHeading('Full test report (tracker not configured)')
                .addRaw(text)
                .write();
              core.setFailed(
                'Secret PAXAVER_TRACKER_TOKEN or variable PAXAVER_TRACKER_REPO is not set. The report is in the run summary; no tracker issue was written.'
              );
              return;
            }

            // github-script@v7 does not expose getOctokit to the script. Build the
            // tracker client from the github client's own class: same plugins
            // and base URL, the tracker token.
            const tracker = new github.constructor({ auth: process.env.TRACKER_TOKEN });
            const { data: openList } = await tracker.rest.issues.listForRepo({
              owner: TRACKER_OWNER, repo: TRACKER_REPO, state: 'open',
              labels: TRACKER_FILTER, per_page: 10,
            });
            const open = openList.find((i) => !i.pull_request) || null;

            if (process.env.FULL_RESULT === 'success') {
              if (open) {
                await tracker.rest.issues.createComment({
                  owner: TRACKER_OWNER, repo: TRACKER_REPO, issue_number: open.number,
                  body: text,
                });
              }
              return;
            }

            if (open) {
              await tracker.rest.issues.createComment({
                owner: TRACKER_OWNER, repo: TRACKER_REPO, issue_number: open.number,
                body: `## New failing run\n\n${failureBody}`,
              });
              return;
            }

            try {
              await tracker.rest.issues.createLabel({
                owner: TRACKER_OWNER, repo: TRACKER_REPO, name: 'ci:full-failed',
                color: 'B60205', description: 'Full test on main failed',
              });
            } catch (e) {
              if (e.status !== 422) throw e; // 422: label already exists
            }
            await tracker.rest.issues.create({
              owner: TRACKER_OWNER, repo: TRACKER_REPO,
              title: 'Full test failed on main',
              labels: ['phase:development', 'ci:full-failed', 'repo:paxaver-mcp'],
              body: failureBody,
            });
