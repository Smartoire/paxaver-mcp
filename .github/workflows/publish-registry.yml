name: Publish to MCP Registry

# Publishes server.json to the Official MCP Registry
# (registry.modelcontextprotocol.io) using GitHub OIDC auth — the OIDC
# identity is the repo's org, which grants io.github.Smartoire/* without a
# stored token or interactive login. Runs on every v* tag push; can also be
# dispatched manually after a release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for github-oidc auth

jobs:
  publish:
    runs-on: ubuntu-latest
    container: node:26-bookworm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # A tag pushed without a version bump would publish the previous
      # version's server.json and fail as a duplicate — assert agreement
      # up front so the failure is explicit.
      - name: Assert tag matches declared version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          SRV=$(node -p "require('./server.json').version")
          if [ "$PKG" != "$TAG" ] || [ "$SRV" != "$TAG" ]; then
            echo "::error::version mismatch — tag=$TAG package.json=$PKG server.json=$SRV"
            exit 1
          fi

      # Pinned release and archive checksum. Bump both together, and only
      # to a release that is at least 7 days old.
      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: '1.8.9'
          MCP_PUBLISHER_SHA256: '4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8'
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher validate

      - name: Authenticate and publish server.json
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
