name: CI

# Public repo: workflows never see secrets on PRs, and this job runs in a
# container on the dedicated `public-repo` runner — nothing touches the
# host. Never use pull_request_target.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: [self-hosted, linux, office, public-repo]
    container: node:26-bookworm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      # The registry publish job requires the tag, package.json and
      # server.json versions to agree — catch drift before the tag.
      - name: Assert package.json and server.json versions agree
        run: |
          PKG=$(node -p "require('./package.json').version")
          SRV=$(node -p "require('./server.json').version")
          if [ "$PKG" != "$SRV" ]; then
            echo "::error::version mismatch — package.json=$PKG server.json=$SRV"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm wrangler:check
