name: CI

# Public repo: workflows never see secrets on PRs. This job runs on a
# GitHub-hosted, ephemeral runner, so fork code never reaches a
# self-hosted runner that also runs publish or report jobs. Never use
# pull_request_target.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Quick checks only (about a minute). The full suite runs every 6 hours on
# main in full.yml, which files a ticket when it fails.

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    container: node:26-bookworm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      # The registry publish job requires the tag and every version-bearing
      # release manifest to agree on the package version — catch drift
      # before the tag.
      - name: Assert release manifest versions agree with package.json
        run: |
          PKG=$(node -p "require('./package.json').version")
          for f in server.json lhm.plugin.json .codex-plugin/plugin.json certification/microsoft/manifest.json; do
            V=$(node -p "require('./$f').version")
            if [ "$PKG" != "$V" ]; then
              echo "::error::version mismatch — package.json=$PKG $f=$V"
              exit 1
            fi
          done
          echo "all release manifest versions agree: $PKG"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
